<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5933d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Solinátor – přihlášení</title>
<style>
  :root{--orange:#f5933d;--navy:#2c3e50;--grey:#6b7785;--bg:#eef1f5;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--navy);
    padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
  .karta{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 8px 30px rgba(44,62,80,0.08);text-align:center;}
  img{width:72px;height:72px;border-radius:18px;}
  h1{font-size:22px;margin:12px 0 4px;}
  p{margin:0 0 18px;color:var(--grey);font-size:14px;}
  button{width:100%;border:none;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer;}
  .apple{background:#000;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .apple svg{width:18px;height:18px;fill:#fff;}
  button:disabled{opacity:0.5;}
  .oddel{margin:20px 0 12px;font-size:13px;color:var(--grey);}
  .kod{display:flex;gap:8px;}
  .kod input{flex:1;min-width:0;border:1px solid #d6dbe1;border-radius:14px;padding:12px;font:inherit;font-size:20px;letter-spacing:0.3em;text-align:center;}
  .kod button{width:auto;flex:0 0 auto;background:var(--orange);color:#fff;padding:12px 16px;}
  .zprava{min-height:20px;margin-top:14px;font-size:14px;}
  .zprava.chyba{color:#c0392b;}
  .napoveda{margin-top:8px;font-size:12px;color:var(--grey);}
</style>
</head>
<body>
<main class="karta">
  <img src="icon-180.png" alt="">
  <h1>Solinátor</h1>
  <p>Přihlas se jednou na tomhle zařízení. Pak už appka přihlášení nechce.</p>
  <button class="apple" id="apple" type="button" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.37 12.6c-.02-2.2 1.8-3.26 1.88-3.31-1.03-1.5-2.62-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.74-.78-2.87-.76-1.47.02-2.83.86-3.59 2.18-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.24 2.73 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.07 2.65-2.13.84-1.22 1.18-2.41 1.2-2.47-.03-.01-2.3-.88-2.3-3.52zM14.2 6.13c.6-.73 1.01-1.75.9-2.76-.87.04-1.92.58-2.54 1.31-.56.65-1.05 1.69-.92 2.68.97.08 1.96-.49 2.56-1.23z"/></svg>
    Přihlásit se přes Apple
  </button>
  <div class="oddel">nebo kód z jiného přihlášeného zařízení</div>
  <form class="kod" id="kodForm">
    <input id="kod" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Šestimístný kód">
    <button type="submit">Přihlásit</button>
  </form>
  <div class="napoveda">Kód vytvoříš v přihlášené appce: Log/Nastavení → Přihlášení → Kód pro další zařízení.</div>
  <div class="zprava" id="zprava" role="status"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(async function () {
  const zpravaEl = document.getElementById('zprava');
  const appleBtn = document.getElementById('apple');
  const zprava = (t, chyba) => { zpravaEl.textContent = t || ''; zpravaEl.className = 'zprava' + (chyba ? ' chyba' : ''); };
  const hotovo = () => location.replace('./');
  async function posli(cesta, telo) {
    const r = await fetch(cesta, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(telo), credentials: 'same-origin' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Přihlášení se nepovedlo.');
    return d;
  }

  document.getElementById('kodForm').addEventListener('submit', async e => {
    e.preventDefault();
    const kod = document.getElementById('kod').value.replace(/\D/g, '');
    if (kod.length !== 6) return zprava('Kód má 6 číslic.', true);
    zprava('Ověřuji…');
    try { await posli('api/auth/kod/pouzit', { kod }); hotovo(); }
    catch (err) { zprava(err.message, true); }
  });

  let stav;
  try { stav = await (await fetch('api/auth/stav', { cache: 'no-store' })).json(); }
  catch { return zprava('Server neodpovídá — zkus to za chvíli.', true); }
  if (stav.prihlasen) return hotovo();
  if (!stav.firebase || !window.firebase) return zprava('Přihlášení přes Apple teď nejde načíst. Použij kód.', true);

  firebase.initializeApp(stav.firebase);
  const auth = firebase.auth();
  // Po návratu od Apple: Firebase token vyměnit za přihlášení do appky
  async function dokonci(user) {
    zprava('Přihlašuji…');
    const idToken = await user.getIdToken(true);
    try {
      await posli('api/auth/firebase', { idToken });
      await auth.signOut().catch(() => {});   // dál stačí přihlášení appky
      hotovo();
    } catch (err) {
      await auth.signOut().catch(() => {});
      zprava(err.message, true);
      appleBtn.disabled = false;
    }
  }
  try {
    const r = await auth.getRedirectResult();
    if (r && r.user) return dokonci(r.user);
  } catch (err) {
    zprava(err && err.code === 'auth/web-storage-unsupported'
      ? 'Prohlížeč blokuje přihlášení. Použij kód z jiného zařízení.'
      : 'Přihlášení přes Apple se nepovedlo (' + (err.code || err.message) + ').', true);
  }
  appleBtn.disabled = false;
  appleBtn.addEventListener('click', async () => {
    appleBtn.disabled = true;
    zprava('Přesměrovávám na Apple…');
    const p = new firebase.auth.OAuthProvider('apple.com');
    p.addScope('email');
    p.addScope('name');
    p.setCustomParameters({ locale: 'cs_CZ' });
    try { await auth.signInWithRedirect(p); }
    catch (err) { zprava('Přihlášení přes Apple se nepovedlo (' + (err.code || err.message) + ').', true); appleBtn.disabled = false; }
  });
})();
</script>
</body>
</html>
